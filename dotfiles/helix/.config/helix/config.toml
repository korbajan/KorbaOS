theme = "nord"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
end-of-line-diagnostics = "hint"
completion-replace = true

[editor.lsp]
display-inlay-hints = false

[editor.statusline]
left = ["mode"]
center = ["position", "file-name", "total-line-numbers", "file-modification-indicator"]
right = ["spinner", "diagnostics", "workspace-diagnostics", "selections", "file-type", "file-indent-style", "file-encoding", "file-line-ending"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.file-picker]
hidden = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.inline-diagnostics]
cursor-line = "error"

[keys.normal]
a = ["append_mode", "collapse_selection"]
i = ["insert_mode", "collapse_selection"]

[keys.normal.space]
q = ":quit"
i = ":toggle lsp.display-inlay-hints"
"=" = ":format" # like = but runs the language formatter (ruff for python)
